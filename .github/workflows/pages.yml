name: Deploy to GitHub Pages

# Tijdelijke, gratis live-demo op https://<user>.github.io/Reason3n/
# Bouwt de statische export met basePath /Reason3n en publiceert naar Pages.
# Geen server, DNS of secrets nodig (gebruikt de ingebouwde GITHUB_TOKEN).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static export (root, voor custom domein)
        run: npm run build --workspace=@reason3n/web

      - name: Voorkom Jekyll-verwerking (behoud _next map)
        run: touch apps/web/out/.nojekyll

      - name: Custom domein (CNAME)
        run: echo 'reason3n.dif3r3nt.nl' > apps/web/out/CNAME

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
